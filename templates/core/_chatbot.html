<!-- Floating Chatbot Widget -->
<div id="chatbot-widget" class="fixed bottom-6 right-6 z-50">
    <!-- Chatbot Toggle Button -->
    <button id="chatbot-toggle" class="w-14 h-14 rounded-full bg-[#7DB7FF] shadow-[0_8px_25px_rgba(125,183,255,0.3)] flex items-center justify-center text-[#081120] hover:scale-105 hover:shadow-[0_8px_30px_rgba(125,183,255,0.4)] transition-all duration-300 cursor-pointer">
        <i data-lucide="message-square" class="w-6 h-6 animate-float"></i>
    </button>

    <!-- Chatbot Window -->
    <div id="chatbot-window" class="hidden absolute bottom-16 right-0 w-80 sm:w-96 bg-gradient-to-b from-[#07182E]/95 to-[#081120]/95 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl flex-col overflow-hidden" style="height: 500px; max-height: 80vh;">
        <!-- Header -->
        <div class="bg-[#0D1B2A]/95 border-b border-white/10 p-4 text-white flex justify-between items-center">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-white/10 flex items-center justify-center border border-white/20 relative">
                    <i data-lucide="bot" class="w-4 h-4 text-white"></i>
                    <span class="absolute bottom-0 right-0 w-2 h-2 rounded-full bg-[#7DB7FF] border border-[#0D1B2A] animate-pulse"></span>
                </div>
                <div>
                    <h3 class="font-bold text-sm tracking-tight" style="font-family: var(--font-heading);">Care Assistant</h3>
                    <p class="text-[9px] text-white/80 uppercase font-bold tracking-wider">Online</p>
                </div>
            </div>
            <button id="chatbot-close" class="w-8 h-8 rounded-lg flex items-center justify-center bg-white/10 border border-white/5 hover:bg-white/20 text-white/90 hover:text-white transition-colors cursor-pointer">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <!-- Messages Area -->
        <div id="chatbot-messages" class="flex-1 p-4 overflow-y-auto bg-transparent flex flex-col gap-4">
            <div class="flex gap-3 animate-fade-in-up">
                <div class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0 mt-auto shadow-sm">
                    <i data-lucide="bot" class="w-4 h-4 text-[#7DB7FF]"></i>
                </div>
                <div class="bg-[#0D1B2A] border border-white/5 p-3.5 rounded-2xl rounded-tl-none shadow-sm text-sm text-[#C7D0D9] max-w-[80%] leading-relaxed">
                    Hi! I'm your Helping Hand assistant. How can I help you today? You can also upload images if you need assistance with medical documents.
                </div>
            </div>
        </div>

        <!-- Image Preview Area -->
        <div id="image-preview-container" class="hidden px-4 py-3 bg-[#07182E]/50 border-t border-white/10 flex items-center gap-3">
            <img id="image-preview" src="" alt="Preview" class="h-10 w-10 object-cover rounded-lg shadow-md border border-white/10">
            <span id="image-name" class="text-xs text-slate-400 truncate flex-1 font-medium"></span>
            <button id="remove-image" class="text-slate-400 hover:text-red-400 transition-colors cursor-pointer">
                <i data-lucide="x-circle" class="w-4.5 h-4.5"></i>
            </button>
        </div>

        <!-- Input Area -->
        <div class="p-3 bg-[#0D1B2A]/90 border-t border-white/10">
            <form id="chatbot-form" class="flex items-center gap-2">
                {% csrf_token %}
                <label for="chat-image-upload" class="cursor-pointer text-slate-400 hover:text-[#7DB7FF] transition-colors p-2.5 hover:bg-white/5 rounded-xl">
                    <i data-lucide="image" class="w-5 h-5"></i>
                </label>
                <input type="file" id="chat-image-upload" accept="image/*" class="hidden">
                
                <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 bg-[#081120] border border-white/10 rounded-full px-4 py-2.5 text-sm text-white focus:ring-1 focus:ring-[#7DB7FF] focus:border-[#7DB7FF] outline-none transition-all placeholder-slate-500">
                
                <button type="submit" class="w-10 h-10 rounded-full bg-[#7DB7FF] flex items-center justify-center text-[#081120] shrink-0 hover:scale-105 transition-transform duration-200 cursor-pointer shadow-md" id="chat-submit-btn">
                    <i data-lucide="send" class="w-4 h-4 ml-0.5"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<style>
    /* Add basic animation for the loading dots */
    .typing-dot {
        animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes typing {
        0%, 80%, 100% { transform: scale(0); }
        40% { transform: scale(1); }
    }
</style>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('chatbot-toggle');
    const closeBtn = document.getElementById('chatbot-close');
    const windowEl = document.getElementById('chatbot-window');
    const form = document.getElementById('chatbot-form');
    const input = document.getElementById('chat-input');
    const messagesEl = document.getElementById('chatbot-messages');
    
    const imageUpload = document.getElementById('chat-image-upload');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const imageName = document.getElementById('image-name');
    const removeImageBtn = document.getElementById('remove-image');
    
    let currentBase64Image = null;

    // Sanitize text to prevent XSS
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    // Toggle logic
    toggleBtn.addEventListener('click', () => {
        windowEl.classList.toggle('hidden');
        windowEl.classList.toggle('flex');
        if (!windowEl.classList.contains('hidden')) {
            input.focus();
        }
    });

    closeBtn.addEventListener('click', () => {
        windowEl.classList.add('hidden');
        windowEl.classList.remove('flex');
    });

    // Image upload handling with client-side compression
    imageUpload.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                // Resize image to max 800px width/height to prevent Network Errors from payload limits
                const MAX_WIDTH = 800;
                const MAX_HEIGHT = 800;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }
                } else {
                    if (height > MAX_HEIGHT) {
                        width *= MAX_HEIGHT / height;
                        width = MAX_HEIGHT;
                    }
                }

                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                // Compress to JPEG with 0.7 quality
                const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                
                currentBase64Image = compressedDataUrl.split(',')[1];
                imagePreview.src = compressedDataUrl;
                imageName.textContent = file.name;
                imagePreviewContainer.classList.remove('hidden');
                input.focus();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    removeImageBtn.addEventListener('click', () => {
        currentBase64Image = null;
        imageUpload.value = '';
        imagePreviewContainer.classList.add('hidden');
    });

    // Send message logic
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        const base64Img = currentBase64Image;
        const previewSrc = imagePreview.src;

        if (!text && !base64Img) return;

        // Clear input state immediately
        input.value = '';
        currentBase64Image = null;
        imageUpload.value = '';
        imagePreviewContainer.classList.add('hidden');

        // Render User Message
        appendUserMessage(text, base64Img ? previewSrc : null);
        
        // Show loading
        const loadingId = appendLoading();

        try {
            const csrfToken = form.querySelector('[name=csrfmiddlewaretoken]').value;
            
            // Scrape the main content of the current page for context
            let pageContext = '';
            const mainElement = document.querySelector('main');
            if (mainElement) {
                // Get inner text and truncate to ~3000 chars to avoid massive payloads
                pageContext = mainElement.innerText.substring(0, 3000).trim();
            }

            const response = await fetch('/api/chatbot/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    message: text,
                    image: base64Img,
                    page_context: pageContext
                })
            });

            const data = await response.json();
            removeLoading(loadingId);

            if (response.ok) {
                appendBotMessage(data.response);
            } else {
                appendBotMessage("Sorry, I encountered an error. Please try again.");
                console.error("Chatbot API error:", data.error);
            }
            
        } catch (error) {
            removeLoading(loadingId);
            appendBotMessage("Network error. Please check your connection.");
            console.error("Chatbot fetch error:", error);
        }
    });

    function appendUserMessage(text, imgSrc) {
        let contentHtml = '';
        if (imgSrc) {
            contentHtml += `<img src="${imgSrc}" class="w-full max-w-[200px] rounded-lg mb-2 object-contain bg-white/5 border border-white/10">`;
        }
        if (text) {
            contentHtml += `<p class="text-sm break-words">${escapeHtml(text)}</p>`;
        }

        const msgHtml = `
            <div class="flex gap-2 justify-end animate-fade-in-up">
                <div class="bg-[#07182E] border border-[#7DB7FF]/15 text-white p-3.5 rounded-2xl rounded-tr-none shadow-md max-w-[80%] leading-relaxed">
                    ${contentHtml}
                </div>
            </div>
        `;
        messagesEl.insertAdjacentHTML('beforeend', msgHtml);
        scrollToBottom();
    }

    function appendBotMessage(text) {
        // Simple markdown parsing for bold text
        const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        
        const msgHtml = `
            <div class="flex gap-3 animate-fade-in-up">
                <div class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0 mt-auto shadow-sm">
                    <i data-lucide="bot" class="w-4 h-4 text-[#7DB7FF]"></i>
                </div>
                <div class="bg-[#0D1B2A] border border-white/5 p-3.5 rounded-2xl rounded-tl-none shadow-sm text-sm text-[#C7D0D9] max-w-[80%] leading-relaxed">
                    ${formattedText}
                </div>
            </div>
        `;
        messagesEl.insertAdjacentHTML('beforeend', msgHtml);
        lucide.createIcons();
        scrollToBottom();
    }

    function appendLoading() {
        const id = 'loading-' + Date.now();
        const msgHtml = `
            <div id="${id}" class="flex gap-3">
                <div class="w-8 h-8 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center shrink-0 mt-auto shadow-sm">
                    <i data-lucide="bot" class="w-4 h-4 text-[#7DB7FF]"></i>
                </div>
                <div class="bg-[#0D1B2A] border border-white/5 p-3 rounded-2xl rounded-tl-none shadow-sm text-sm text-[#C7D0D9] flex items-center gap-1.5">
                    <div class="w-2 h-2 bg-[#7DB7FF] rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-[#7DB7FF] rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-[#7DB7FF] rounded-full typing-dot"></div>
                </div>
            </div>
        `;
        messagesEl.insertAdjacentHTML('beforeend', msgHtml);
        lucide.createIcons();
        scrollToBottom();
        return id;
    }

    // --- Persist Chat History ---
    function saveHistory() {
        sessionStorage.setItem('chatbotHistory', messagesEl.innerHTML);
    }

    function loadHistory() {
        if (window.performance) {
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].type === "reload") {
                sessionStorage.removeItem('chatbotHistory');
                return;
            }
        }

        const saved = sessionStorage.getItem('chatbotHistory');
        if (saved) {
            messagesEl.innerHTML = saved;
            windowEl.classList.remove('hidden');
            windowEl.classList.add('flex');
            scrollToBottom();
            lucide.createIcons();
        }
    }

    const originalAppendUserMsg = appendUserMessage;
    appendUserMessage = function(text, imgSrc) {
        originalAppendUserMsg(text, imgSrc);
        saveHistory();
    }

    const originalAppendBotMsg = appendBotMessage;
    appendBotMessage = function(text) {
        originalAppendBotMsg(text);
        saveHistory();
    }

    const originalAppendLoading = appendLoading;
    appendLoading = function() {
        const id = originalAppendLoading();
        saveHistory();
        return id;
    }

    window.removeLoading = function(id) {
        const el = document.getElementById(id);
        if (el) el.remove();
        saveHistory();
    };

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    loadHistory();
});
</script>
